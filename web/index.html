<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trakt 自动追踪</title><link rel="stylesheet" href="style.css"></head><body>
<main><h1>Trakt 自动追踪</h1><p>将 MovieClaw 的播放活动同步到你绑定的 Trakt 账号。</p>
<p>先在<a href="/settings/plugins" target="_top">插件设置</a>填写自己 Trakt 应用的 Client ID（Client Secret 可留空），再为成员连接账号。</p>
<section><label for="member">MovieClaw 成员 ID（管理员为 0）</label>
<input id="member" type="number" min="0" value="0"><button id="refresh">查看状态</button>
<p class="hint">每个成员独立绑定；没有绑定的成员不会同步。这里只允许管理员操作。</p></section>
<section><h2>账号连接</h2><p id="status" role="status" aria-live="polite">正在读取…</p>
<button id="connect">连接 Trakt</button><button id="disconnect">断开连接</button>
<button id="retry" hidden>重试失败记录</button>
<div id="authorization" hidden><p>打开 <a id="verify" target="_blank" rel="noopener noreferrer">Trakt 授权页面</a>，输入：</p>
<strong id="code"></strong><p id="auth-state" role="status" aria-live="polite"></p></div></section>
<p id="error" role="alert"></p>
<footer><p>仅上报播放活动，不批量导入历史。为避免重复，重试时可能检查相邻观看记录。没有外部编号的内容不会猜测匹配。</p>
<p>MovieClaw Trakt uses Trakt but is not endorsed or certified by Trakt.</p></footer>
</main><script src="app.js"></script></body></html>
